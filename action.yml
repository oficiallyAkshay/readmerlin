name: readmerlin
description: Holds the README of a skill, agent or MCP server repo to its rules. Value first, badges that carry facts, plain sentences.
branding:
  icon: book-open
  color: purple
inputs:
  path:
    description: README to check, when pages is false
    default: README.md
  pages:
    description: Also check CONTRIBUTING and every docs page, not only the README
    default: "true"
  links:
    description: Check external links and badge logos
    default: "true"
  exec:
    description: Run the count-source commands from readmerlin.json. Off by default, since they are shell commands from the repo.
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RM_PATH: ${{ inputs.path }}
        RM_PAGES: ${{ inputs.pages }}
        RM_LINKS: ${{ inputs.links }}
        RM_EXEC: ${{ inputs.exec }}
      run: |
        set -euo pipefail
        FLAGS=()
        [ "$RM_LINKS" = "true" ] || FLAGS+=(--no-links)
        [ "$RM_EXEC" = "true" ] || FLAGS+=(--no-exec)
        # The script the skill carries, from this action's own checkout: the commit you pin is the code that runs.
        if [ "$RM_PAGES" = "true" ]; then
          node "$GITHUB_ACTION_PATH/skills/readmerlin/scripts/readmerlin.mjs" check --pages --format github "${FLAGS[@]}"
        else
          node "$GITHUB_ACTION_PATH/skills/readmerlin/scripts/readmerlin.mjs" check "$RM_PATH" --format github "${FLAGS[@]}"
        fi
