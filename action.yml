name: readmerlin
description: Checks, or writes, the README of a skill, agent or MCP server repo. Value first, honest badges, no slop.
branding:
  icon: book-open
  color: purple
inputs:
  path:
    description: README to check
    default: README.md
  mode:
    description: check or write. write needs ANTHROPIC_API_KEY in env, or GITHUB_TOKEN with permissions models read.
    default: check
  version:
    description: readmerlin version to run. Pin it for reproducible runs.
    default: latest
  links:
    description: Check external links and badge logos
    default: "true"
  exec:
    description: Run the count-source commands from readmerlin.json. Off by default, since they are shell commands from the repo.
    default: "false"
  model:
    description: Model id for write mode, used by the anthropic and github backends
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RM_MODE: ${{ inputs.mode }}
        RM_PATH: ${{ inputs.path }}
        RM_VERSION: ${{ inputs.version }}
        RM_LINKS: ${{ inputs.links }}
        RM_EXEC: ${{ inputs.exec }}
        RM_MODEL: ${{ inputs.model }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        FLAGS=()
        [ "$RM_LINKS" = "true" ] || FLAGS+=(--no-links)
        [ "$RM_EXEC" = "true" ] || FLAGS+=(--no-exec)
        MODEL=()
        [ -z "$RM_MODEL" ] || MODEL=(--model "$RM_MODEL")
        if [ "$RM_MODE" = "write" ]; then
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            npx -y -p "readmerlin@$RM_VERSION" -p @anthropic-ai/sdk readmerlin write . --out "$RM_PATH" --backend anthropic "${MODEL[@]}"
          else
            npx -y "readmerlin@$RM_VERSION" write . --out "$RM_PATH" --backend github "${MODEL[@]}"
          fi
        fi
        npx -y "readmerlin@$RM_VERSION" check "$RM_PATH" --format github "${FLAGS[@]}"
