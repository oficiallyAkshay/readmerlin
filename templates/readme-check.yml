name: readme check
on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
permissions:
  contents: read
jobs:
  readmerlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oficiallyAkshay/readmerlin@<sha>   # <comment>
        with:
          # The count commands come from this repo's own readmerlin.json, so in this repo's own CI
          # they are already trusted. The action's own default stays off, for a workflow that
          # checks a different repo's README.
          exec: "true"
