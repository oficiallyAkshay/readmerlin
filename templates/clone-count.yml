name: clone count
# Accumulates GitHub clone traffic into a gist, since GitHub itself keeps only 14 days.
# Needs one secret, CLONE_TOKEN: a fine-grained token with Administration read on this repo and Gists write.
# After the first run, the job summary prints the badge to paste into the README.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CLONE_TOKEN }}
    steps:
      - name: fetch the last 14 days
        run: gh api "repos/${{ github.repository }}/traffic/clones" > today.json
      - name: find or create the gist
        id: gist
        run: |
          id=$(gh gist list --limit 100 | awk -v want="clones: ${{ github.repository }}" '$0 ~ want {print $1; exit}')
          if [ -z "$id" ]; then
            echo '{"count":0,"uniques":0,"days":{}}' > clones.json
            id=$(gh gist create --public --desc "clones: ${{ github.repository }}" clones.json | awk -F/ '{print $NF}')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: merge by day
        run: |
          gh gist view "${{ steps.gist.outputs.id }}" -f clones.json > before.json || echo '{"count":0,"uniques":0,"days":{}}' > before.json
          node -e '
            const fs = require("fs");
            const before = JSON.parse(fs.readFileSync("before.json", "utf8"));
            const today = JSON.parse(fs.readFileSync("today.json", "utf8"));
            const days = before.days || {};
            for (const d of today.clones || []) days[d.timestamp.slice(0, 10)] = { count: d.count, uniques: d.uniques };
            const count = Object.values(days).reduce((a, d) => a + d.count, 0);
            const uniques = Object.values(days).reduce((a, d) => a + d.uniques, 0);
            fs.writeFileSync("clones.json", JSON.stringify({ count, uniques, days, updated: new Date().toISOString().slice(0, 10) }, null, 2));
            console.log(`clones ${count}, unique cloners ${uniques}, ${Object.keys(days).length} days`);
          '
          gh gist edit "${{ steps.gist.outputs.id }}" -f clones.json clones.json
      - name: badge
        run: |
          owner="${{ github.repository_owner }}"
          raw="https://gist.githubusercontent.com/$owner/${{ steps.gist.outputs.id }}/raw/clones.json"
          src="https://img.shields.io/badge/dynamic/json?label=clones&query=count&url=$raw&logo=github&logoColor=white"
          {
            echo "### Clone badge"
            echo
            echo '```html'
            echo "<a href=\"https://github.com/${{ github.repository }}/graphs/traffic\"><img alt=\"clones\" src=\"$src\"></a>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
