name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A second push to a pull request supersedes the first, so cancel the run it
# replaced. Pushes to main key on the commit instead, so a rapid second push
# gets its own group rather than dropping the first push's run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secrets scan over the whole history, separate from the test matrix.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks reads pull request metadata to report what it finds.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history, not the working tree.
          fetch-depth: 0
          persist-credentials: false
      # The same hook contributors run locally, so CI and the pre-commit
      # config cannot drift. gitleaks's own pre-commit hook only sees the
      # working tree; the secrets scan step below covers the full history
      # a hook cannot see. pipx ships preinstalled on the runner image, so
      # this needs no extra setup step for a repo with no other Python use.
      - name: pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

      # pinact has no pre-commit hook of its own to pin to, so it runs as its
      # own step: every `uses:` must be a full commit SHA, and that SHA must
      # actually be the commit the trailing version comment names, never a
      # hand-edited or stale one. fix: "false" only checks; it never rewrites
      # a workflow file or pushes a commit.
      - name: verify actions are pinned
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"

      - name: secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Codecov uploads with an OIDC token rather than a repository secret.
      id-token: write
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # One report per run, so only the newest leg uploads. The upload is
      # tokenless: it authenticates with the job's OIDC identity, which
      # Codecov accepts from a public repository. A Codecov outage must not
      # block a merge, so the step reports and moves on.
      - name: upload coverage
        if: matrix.node == 22
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: self check
        run: node skills/readmerlin/scripts/readmerlin.mjs check --pages --format github

  # The one context a required-checks rule needs to know. It exists on
  # every run, whatever happens to checks or test, and fails unless every
  # job it needs actually succeeded.
  ci:
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
