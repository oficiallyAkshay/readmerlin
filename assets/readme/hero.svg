<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t">
<title id="t">Your repo feeds three pages on every merge: the README a person reads, and the CONTRIBUTING and docs an agent reads, every item on them checked</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/></marker>
<radialGradient id="wash" cx="0.85" cy="0.2" r="0.7"><stop offset="0" stop-color="#c7d2fe" stop-opacity="0.9"/><stop offset="0.5" stop-color="#99f6e4" stop-opacity="0.45"/><stop offset="1" stop-color="#fbfaf7" stop-opacity="0"/></radialGradient>
<style>
.paper{fill:#fbfaf7}
.eyebrow{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;fill:#7c3aed}
.big{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:52px;font-weight:800;letter-spacing:-1.5px;fill:#1e1b4b}
.sub{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:17px;fill:#475569}
.card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1}
.head{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:18px;font-weight:800;letter-spacing:0.5px}
.item{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:16px;fill:#1e1b4b}
.tick{fill:none;stroke:#16a34a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#1e1b4b;stroke-width:1.6}
.merge{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;fill:#1e1b4b}
.repo{fill:#1e1b4b}
.repotext{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:17px;font-weight:700;fill:#ffffff}
.glyph{fill:none;stroke:#1e1b4b;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.who{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;fill:#1e1b4b}
.cap{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-size:14px;fill:#64748b}
@media (prefers-color-scheme: dark){
 .paper{fill:#0f1222}.big,.item,.flow,.merge,.who,.glyph{fill:#f8fafc;stroke:#f8fafc}.item,.big,.merge,.who{stroke:none}.flow,.glyph{fill:none}.card{fill:#171a2e;stroke:#2a2f4a}.sub{fill:#a5b4fc}.cap{fill:#94a3b8}.repo{fill:#f8fafc}.repotext{fill:#1e1b4b}.tick{stroke:#4ade80}
}
</style></defs>
<rect class="paper" x="0" y="0" width="1200" height="500"/>
<rect x="0" y="0" width="1200" height="500" fill="url(#wash)"/>
<text class="eyebrow" x="60" y="86">README · CONTRIBUTING · DOCS</text>
<text class="big" x="58" y="150">Never</text>
<text class="big" x="58" y="210">goes stale.</text>
<text class="sub" x="60" y="252">Three pages, one repo.</text>
<text class="sub" x="60" y="276">Every link, badge and number</text>
<text class="sub" x="60" y="300">on them, checked on every merge.</text>
<g class="glyph" style="stroke-width:2"><circle cx="70" cy="365" r="6"/><path d="M59,385 a11,11 0 0 1 22,0"/></g><text class="who" x="92" y="376">THE PERSON</text><text class="cap" x="218" y="376">reads the README</text>
<g class="glyph" style="stroke-width:2"><rect x="61" y="406" width="18" height="15" rx="4"/><path d="M70,406 v-4"/><path d="M58,433 a12,12 0 0 1 24,0"/></g><circle cx="66.5" cy="413" r="1.5" fill="#1e1b4b"/><circle cx="73.5" cy="413" r="1.5" fill="#1e1b4b"/><text class="who" x="92" y="424">THE AGENT</text><text class="cap" x="210" y="424">reads CONTRIBUTING and docs</text>
<rect class="repo" x="730" y="82" width="140" height="42" rx="21"/>
<text class="repotext" x="800" y="109" text-anchor="middle">your repo</text>
<path class="flow" d="M770,124 C 770,154 546,152 546,182" marker-end="url(#a)"/>
<path class="flow" d="M800,124 v14"/><path class="flow" d="M800,168 v14" marker-end="url(#a)"/>
<path class="flow" d="M830,124 C 830,154 1054,152 1054,182" marker-end="url(#a)"/>
<text class="merge" x="800" y="158" text-anchor="middle">ON EVERY MERGE</text>
<rect class="card" x="430" y="190" width="232" height="262" rx="6"/>
<rect x="430" y="190" width="6" height="262" fill="#2563eb"/>
<text class="head" x="454" y="224" style="fill:#2563eb">README</text>
<g class="glyph" style="stroke-width:2"><circle cx="632" cy="217" r="6"/><path d="M621,237 a11,11 0 0 1 22,0"/></g>
<path class="tick" d="M456,255 l4,4 l8,-9"/>
<text class="item" x="476" y="260">what it does</text>
<path class="tick" d="M456,282 l4,4 l8,-9"/>
<text class="item" x="476" y="287">picture</text>
<path class="tick" d="M456,309 l4,4 l8,-9"/>
<text class="item" x="476" y="314">features</text>
<path class="tick" d="M456,336 l4,4 l8,-9"/>
<text class="item" x="476" y="341">fit</text>
<path class="tick" d="M456,363 l4,4 l8,-9"/>
<text class="item" x="476" y="368">security</text>
<path class="tick" d="M456,390 l4,4 l8,-9"/>
<text class="item" x="476" y="395">compares</text>
<path class="tick" d="M456,417 l4,4 l8,-9"/>
<text class="item" x="476" y="422">etc.</text>
<rect class="card" x="684" y="190" width="232" height="262" rx="6"/>
<rect x="684" y="190" width="6" height="262" fill="#7c3aed"/>
<text class="head" x="708" y="224" style="fill:#7c3aed">CONTRIBUTING</text>
<g class="glyph" style="stroke-width:2"><rect x="877" y="210" width="18" height="15" rx="4"/><path d="M886,210 v-4"/><path d="M874,237 a12,12 0 0 1 24,0"/></g><circle cx="882.5" cy="217" r="1.5" fill="#1e1b4b"/><circle cx="889.5" cy="217" r="1.5" fill="#1e1b4b"/>
<path class="tick" d="M710,255 l4,4 l8,-9"/>
<text class="item" x="730" y="260">commands</text>
<path class="tick" d="M710,282 l4,4 l8,-9"/>
<text class="item" x="730" y="287">settings</text>
<path class="tick" d="M710,309 l4,4 l8,-9"/>
<text class="item" x="730" y="314">workflows</text>
<path class="tick" d="M710,336 l4,4 l8,-9"/>
<text class="item" x="730" y="341">badge recipes</text>
<path class="tick" d="M710,363 l4,4 l8,-9"/>
<text class="item" x="730" y="368">how it fits</text>
<path class="tick" d="M710,390 l4,4 l8,-9"/>
<text class="item" x="730" y="395">order of work</text>
<path class="tick" d="M710,417 l4,4 l8,-9"/>
<text class="item" x="730" y="422">etc.</text>
<rect class="card" x="938" y="190" width="232" height="262" rx="6"/>
<rect x="938" y="190" width="6" height="262" fill="#0d9488"/>
<text class="head" x="962" y="224" style="fill:#0d9488">docs</text>
<g class="glyph" style="stroke-width:2"><rect x="1131" y="210" width="18" height="15" rx="4"/><path d="M1140,210 v-4"/><path d="M1128,237 a12,12 0 0 1 24,0"/></g><circle cx="1136.5" cy="217" r="1.5" fill="#1e1b4b"/><circle cx="1143.5" cy="217" r="1.5" fill="#1e1b4b"/>
<path class="tick" d="M964,255 l4,4 l8,-9"/>
<text class="item" x="984" y="260">guides</text>
<path class="tick" d="M964,282 l4,4 l8,-9"/>
<text class="item" x="984" y="287">reference</text>
<path class="tick" d="M964,309 l4,4 l8,-9"/>
<text class="item" x="984" y="314">rule ids</text>
<path class="tick" d="M964,336 l4,4 l8,-9"/>
<text class="item" x="984" y="341">examples</text>
<path class="tick" d="M964,363 l4,4 l8,-9"/>
<text class="item" x="984" y="368">benchmarks</text>
<path class="tick" d="M964,390 l4,4 l8,-9"/>
<text class="item" x="984" y="395">changelog</text>
<path class="tick" d="M964,417 l4,4 l8,-9"/>
<text class="item" x="984" y="422">etc.</text>
</svg>
