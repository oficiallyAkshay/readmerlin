# The same hooks CI runs, run here through pre-commit. gitleaks, actionlint
# and zizmor are standalone tools pre-commit installs on its own; readmerlin
# has no other language pre-commit would gate, since typecheck, build and
# test already run in CI.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # v1.30.1
    hooks:
      - id: zizmor
