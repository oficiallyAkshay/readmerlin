# The same hook CI runs, run here through pre-commit. gitleaks is a
# standalone tool pre-commit installs on its own; readmerlin has no other
# language pre-commit would gate, since typecheck, build and test already
# run in CI.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
